    <style>
        /* 기본 테마 */
        body { background-color: #0a0e17; color: #fff; font-family: 'Arial', sans-serif; }
        .navbar { background-color: #000; }
        .hero { min-height: 60vh; }
        
        /* 라이트 모드 설정 */
        body.light-mode { background-color: #f8f9fa !important; color: #212529 !important; }
        body.light-mode .hero { background: linear-gradient(to bottom, #e9ecef, #f8f9fa) !important; }
        
        body.light-mode h1, body.light-mode h2, body.light-mode p, body.light-mode label { color: #212529 !important; }
        
        /* 네비게이션 바 라이트 모드 처리 */

        body.light-mode .navbar .nav-link, body.light-mode #themeToggleBtn { color: #212529 !important; }

        /* 버튼 및 기타 스타일 */
        .btn-primary { background-color: #a020f0; border: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <img src="/image/lol-logo.jpg" alt="LOL Logo" width="30" height="24">

    <button class="btn border-0" id="themeToggleBtn">
        DARK

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/">리그홈</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/#news">뉴스</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/#champion">챔피언</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/main_page_sub/download.html">다운로드</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/login">로그인</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            외부웹사이트
          </a>
          <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/" target ="_blank">롤공식홈</a></li>
            <li><a class="dropdown-item" href="https://lol.ps/" target ="_blank">롤전적</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="https://www.youtube.com/@LeagueofLegends-Korea" target = "_blank">관련유튜브</a></li>
          </ul>
        </li>
      </ul>
      <form class="d-flex" id="searchForm">
        <input class="form-control me-2" type="search" placeholder="챔피언, 뉴스 검색..." aria-label="Search" id="searchInput">
        <button class="btn btn-outline-success" type="submit">검색하기</button>
      </form>
    </div>
  </div>
</nav>
   
<section class="hero d-flex align-items-center justify-content-center text-center py-5">
  <div class="container" style="max-width: 400px;">
    <h2 class="fw-bold mb-4">로그인</h2>

    <form method="POST" action="/login_check" id="loginForm">
      <div class="mb-3 text-start">
        <label class="form-label">아이디</label>
        <input type="text" class="form-control" id="usernameInput" name="username" placeholder="4~20자 영문/숫자" required>
        <div class="invalid-feedback" id="usernameMsg"></div>
      </div>
      <div class="mb-3 text-start">
        <label class="form-label">패스워드</label>
        <input type="password" class="form-control" id="passwordInput" placeholder="8자 이상, 영문+숫자+특수문자" required>
        <div class="invalid-feedback" id="passwordMsg"></div>
        <input type="hidden" id="password" name="password">
      </div>

      <button type="button" onclick="validateAndLogin()" class="btn btn-primary w-100">로그인</button>
      <hr>
      <a href="/register" class="btn btn-outline-secondary w-100">회원가입</a>
    </form>
  </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('passwordInput'); // 패스워드 입력창
        const usernameInput = document.getElementById('usernameInput'); // 아이디 입력창

        // 엔터키를 감지하여 로그인 함수를 실행하는 공통 함수
        function handleEnterKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // 엔터키의 기본 동작(폼 제출 등)을 막음
                validateAndLogin();     // 기존에 사용하던 로그인 검증 함수 실행
            }
        }

        // 아이디창과 비밀번호창 모두에서 엔터키 작동되도록 리스너 등록
        if (usernameInput) {
            usernameInput.addEventListener('keydown', handleEnterKey);
        }
        if (passwordInput) {
            passwordInput.addEventListener('keydown', handleEnterKey);
        }
    });
</script>

<div class="modal fade" id="championModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" id="modalContent">
        </div>
  </div>
</div>

<script src="/js/search.js"></script>

</body>
