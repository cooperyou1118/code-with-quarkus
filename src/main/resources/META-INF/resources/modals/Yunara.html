<div class="modal-header bg-dark border-secondary">
  <h5 class="modal-title text-white">유나라 (Yunara) 상세정보</h5>
  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body bg-dark text-white">
  <div class="container-fluid">
    <div class="row g-4">

      <div class="col-lg-5 text-center">
        <img src="/image/유나라.jpg" onerror="this.src='/images/LOL.png'" class="img-fluid rounded shadow-lg"
             style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1 text-warning">유나라 (Yunara)</h3>
          <p class="text-secondary fs-5">전사 / 난이도: 중</p>
        </div>
      </div>

      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3 text-warning">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item bg-dark text-white border-secondary">패시브: 투쟁심</li>
          <li class="list-group-item bg-dark text-white border-secondary">Q: 전진 베기</li>
          <li class="list-group-item bg-dark text-white border-secondary">W: 투사의 긍지</li>
          <li class="list-group-item bg-dark text-white border-secondary">E: 회전격</li>
          <li class="list-group-item bg-dark text-white border-secondary">R: 지배자의 영역</li>
        </ul>

        <h4 class="border-bottom border-secondary pb-2 mb-3 text-warning">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
          치명적인 무술과 무기를 자유자재로 다루며 전방을 압박하는 강력한 투사이다.
          한 번 시야에 들어온 적은 절대 놓치지 않으며 전장의 새로운 지배자로 군림한다.
        </p>
      </div>

    </div>
  </div>
</div>

<div class="modal-footer border-secondary bg-dark">
  <button class="btn btn-outline-light" data-bs-dismiss="modal">닫기</button>
</div>
